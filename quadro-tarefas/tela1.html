<script>
document.addEventListener("DOMContentLoaded", function() {
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var id = entry.target.id;
        document.querySelectorAll('.nav-item').forEach(function(nav) {
          if(nav.hasAttribute('data-target')) {
            if(nav.getAttribute('data-target') === id) {
              nav.classList.remove('text-on-surface-variant', 'dark:text-outline');
              nav.classList.add('bg-primary-container', 'dark:bg-on-primary-container', 'text-on-primary-container', 'dark:text-primary-fixed');
            } else {
              nav.classList.remove('bg-primary-container', 'dark:bg-on-primary-container', 'text-on-primary-container', 'dark:text-primary-fixed');
              nav.classList.add('text-on-surface-variant', 'dark:text-outline');
            }
          }
        });
      }
    });
  }, { threshold: 0.5 });
  
  var target1 = document.getElementById('sec-tarefas');
  var target2 = document.getElementById('sec-cofrinho');
  if(target1) observer.observe(target1);
  if(target2) observer.observe(target2);
});
</script>

<script>
(function () {
  var CM = window.CofrinhoMagico;
  var completedExpanded = false;
  // avatarUrl agora vem diretamente de sis.avatarUrl

  function sister(state, id) {
    for (var i = 0; i < state.sisters.length; i++) {
      if (state.sisters[i].id === id) return state.sisters[i];
    }
    return null;
  }

  function cat(state, id) {
    for (var i = 0; i < state.catalog.length; i++) {
      if (state.catalog[i].id === id) return state.catalog[i];
    }
    return null;
  }

  function freqLabel(f) {
    if (f === "semanal") return "Semanal";
    return "Diário";
  }

  function rewardTypeLabel(c) {
    return c.rewardType === "diario" ? "Diário" : "Extra";
  }

  function rewardValueLabel(c) {
    return c.rewardType === "diario" ? "Sem recompensa" : CM.fmtBRL(c.valueBRL);
  }

  function timerHtml(inst) {
    if (!inst || !inst.dueAt) return "";
    var remainingMs = Number(inst.dueAt) - Date.now();
    var overdue = remainingMs <= 0;
    var totalMin = Math.max(0, Math.ceil(Math.abs(remainingMs) / 60000));
    var hours = Math.floor(totalMin / 60);
    var mins = totalMin % 60;
    var timeText = hours > 0 ? hours + "h " + String(mins).padStart(2, "0") + "min" : totalMin + "min";
    return "<div class=\"" + (overdue ? "bg-error-container text-on-error-container border-error/30" : "bg-tertiary-container text-on-tertiary-container border-tertiary/30") + " text-label-sm p-3 rounded-lg mt-2 mb-3 border flex gap-2 items-center\">" +
      "<span class=\"material-symbols-outlined text-[18px] shrink-0\">" + (overdue ? "warning" : "timer") + "</span>" +
      "<span><strong>" + (overdue ? "Tempo esgotado:" : "Tempo restante:") + "</strong> " + timeText + "</span>" +
      "</div>";
  }

  function esc(s) {
    if (!s) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  var tracksExpanded = false;

  function renderProgressTracks(state) {
    var container = document.getElementById("kid-progress-tracks");
    if (!container) return;
    container.innerHTML = "";
    
    var hasTracks = false;
    var tracksData = [];
    
    state.sisters.forEach(function(sis) {
      var countA = 0, countD = 0, countP = 0, countC = 0;
      
      state.catalog.forEach(function(cat) {
        if (cat.sisterId !== sis.id) return;
        
        if (CM.isTaskCompletedInPeriod && CM.isTaskCompletedInPeriod(cat.id)) {
          countC++;
          return;
        }
        
        var inDoing = state.doing.some(function(i) { return i.catalogId === cat.id; });
        if (inDoing) { countD++; return; }
        
        var inPending = state.pending.some(function(i) { return i.catalogId === cat.id; });
        if (inPending) { countP++; return; }
        
        var inAvailable = state.available.some(function(i) { return i.catalogId === cat.id; });
        if (inAvailable) { countA++; return; }
      });
      
      var total = countA + countD + countP + countC;
      if (total === 0) return;
      
      tracksData.push({ sis: sis, countD: countD, countP: countP, countC: countC, total: total });
    });

    if (tracksData.length === 0) {
      container.style.display = "none";
      return;
    }

    container.style.display = "flex";
    
    var visibleTracks = tracksExpanded ? tracksData : [];

    visibleTracks.forEach(function(data) {
      var sis = data.sis;
      var total = data.total;
      var countD = data.countD;
      var countP = data.countP;
      var countC = data.countC;
      
      var maxScore = total * 3;
      var score = (countD * 1) + (countP * 2) + (countC * 3);
      var pct = Math.round((score / maxScore) * 100);
      
      var img = sis.avatarUrl || "";
      var bar = sis.borderColor || "#ccc";
      
      var trackDiv = document.createElement("div");
      trackDiv.className = "relative w-full h-[52px] flex flex-col justify-center my-1";
      
      trackDiv.innerHTML = 
        "<div class=\"absolute w-full h-3 rounded-full overflow-hidden bg-surface-variant dark:bg-outline-variant shadow-inner\">" +
          "<div class=\"h-full transition-all duration-700 ease-out\" style=\"width:" + pct + "%; background-color:" + esc(bar) + ";\"></div>" +
        "</div>" +
        "<div class=\"absolute right-0 -mr-2 w-8 h-8 flex items-center justify-center text-[22px] z-10 drop-shadow-md\">🏁</div>" +
        "<div class=\"absolute w-[44px] h-[44px] rounded-full border-[3px] border-surface shadow-md z-20 transition-all duration-700 ease-out flex items-center justify-center overflow-hidden\" " +
             "style=\"left: calc(" + pct + "% - " + (pct * 44 / 100) + "px); background-color: " + esc(bar) + ";\">" +
          (img ? "<img src=\"" + esc(img) + "\" class=\"w-full h-full object-cover\" />" : "<span class=\"text-lg\">👧</span>") +
        "</div>";
        
      container.appendChild(trackDiv);
    });

    if (tracksData.length > 0) {
      var toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "mt-2 self-center text-label-sm font-label-bold text-primary flex items-center gap-1 active:scale-95 transition-transform bg-surface-container hover:bg-surface-container-high px-3 py-1.5 rounded-full";
      toggleBtn.innerHTML = tracksExpanded 
        ? "Ocultar progresso <span class=\"material-symbols-outlined text-[16px]\">expand_less</span>" 
        : "Ver progresso (" + tracksData.length + ") <span class=\"material-symbols-outlined text-[16px]\">expand_more</span>";
      
      toggleBtn.addEventListener("click", function() {
        tracksExpanded = !tracksExpanded;
        renderProgressTracks(state);
      });
      container.appendChild(toggleBtn);
    }
  }

  function renderAvailable(state) {
    var el = document.getElementById("kid-col-available");
    var openNow = state.available.filter(function (inst) {
      var c = cat(state, inst.catalogId);
      if (!c) return false;
      return !CM.isTaskBlockedByRecurrence(c.id);
    });
    document.getElementById("kid-count-available").textContent = String(openNow.length);
    el.innerHTML = "";
    if (openNow.length === 0) {
      el.innerHTML =
        "<div class=\"rounded-2xl border border-dashed border-outline-variant bg-surface-container-low p-5 text-center text-on-surface-variant\">" +
        "<span class=\"material-symbols-outlined text-4xl mb-2 text-primary\">celebration</span>" +
        "<p class=\"font-title-md text-title-md text-on-surface\">Tudo em dia</p>" +
        "<p class=\"font-body-md text-sm mt-1\">Todas as tarefas deste período já foram concluídas.</p>" +
        "</div>";
      return;
    }
    openNow.forEach(function (inst) {
      var c = cat(state, inst.catalogId);
      if (!c) return;
      var sis = sister(state, c.sisterId);
      var border = sis && sis.borderColor ? sis.borderColor : "#ccc";
      var badge = sis && sis.badgeClass ? sis.badgeClass : "bg-secondary-container text-on-secondary-container";
      var label = sis ? sis.name + " (" + sis.age + ")" : "?";
      var div = document.createElement("div");
      div.className = "bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/60 p-4 sm:p-card-padding hover:shadow-md transition-all active:scale-[0.98] cursor-pointer";
      div.style.borderLeft = "5px solid " + border;
      div.setAttribute("role", "button");
      div.setAttribute("data-instance-id", inst.id);
      var feedbackHtml = "";
      if (inst.feedback) {
        feedbackHtml = "<div class=\"bg-error-container text-on-error-container text-label-sm p-3 rounded-lg mt-2 mb-3 border border-error/30 flex gap-2 items-start\">" +
                       "<span class=\"material-symbols-outlined text-[18px] shrink-0\">campaign</span>" +
                       "<span><strong>Correção pedida:</strong> " + esc(inst.feedback) + "</span>" +
                       "</div>";
      }

      div.innerHTML =
        "<div class=\"flex justify-between items-start gap-3 mb-3\">" +
        "<span class=\"" + esc(badge) + " text-label-sm font-label-bold px-3 py-1 rounded-full normal-case\">" + esc(label) + "</span>" +
        "<span class=\"material-symbols-outlined text-[28px] shrink-0\" style=\"color:" + esc(border) + "\">" + esc(c.icon || "task") + "</span>" +
        "</div>" +
        "<h3 class=\"font-title-md text-title-md text-on-surface mb-2 leading-snug\">" + esc(c.title) + "</h3>" +
        feedbackHtml +
        timerHtml(inst) +
        (c.subtitle && !inst.feedback ? "<p class=\"text-label-sm text-on-surface-variant mb-3\">" + esc(c.subtitle) + "</p>" : (!inst.feedback ? "<div class=\"mb-3\"></div>" : "")) +
        "<div class=\"flex justify-between items-center flex-wrap gap-2 mb-3\">" +
        "<span class=\"bg-surface-variant text-on-surface-variant text-label-sm px-2 py-0.5 rounded-full\">" + esc(freqLabel(c.frequency)) + "</span>" +
        "<span class=\"" + (c.rewardType === "diario" ? "bg-secondary-container text-on-secondary-container" : "bg-primary-container text-on-primary-container") + " text-label-sm px-2 py-0.5 rounded-full font-label-bold\">" + esc(rewardTypeLabel(c)) + "</span>" +
        "<div class=\"bg-tertiary-container text-on-tertiary-container font-label-bold px-4 py-1.5 rounded-full flex items-center gap-1 shadow-[0_2px_0_0_rgba(105,95,31,0.2)]\">" +
        "<span class=\"material-symbols-outlined text-[18px]\">payments</span>" +
        esc(rewardValueLabel(c)) +
        "</div>" +
        "</div>" +
        "<div class=\"min-h-11 rounded-xl bg-primary/10 text-primary font-label-bold text-label-bold flex items-center justify-center gap-2\">" +
        "<span class=\"material-symbols-outlined text-[20px]\">play_arrow</span>" +
        "<span>Começar tarefa</span>" +
        "</div>";
      div.addEventListener("click", function () {
        CM.startTask(inst.id);
      });
      el.appendChild(div);
    });
  }

  function renderDoing(state) {
    var el = document.getElementById("kid-col-doing");
    el.innerHTML = "";
    if (state.doing.length === 0) {
      el.classList.add("items-center", "justify-center", "text-center", "text-on-surface-variant");
      el.innerHTML =
        "<div class=\"rounded-2xl border border-dashed border-outline-variant bg-surface-container-lowest p-5 w-full\">" +
        "<span class=\"material-symbols-outlined text-[44px] mb-2 text-primary opacity-70\">touch_app</span>" +
        "<p class=\"font-title-md text-title-md text-on-surface\">Escolha uma tarefa</p>" +
        "<p class=\"font-body-md text-sm mt-1 px-2\">Toque em uma tarefa disponível para começar.</p>" +
        "</div>";
      return;
    }
    el.classList.remove("items-center", "justify-center", "text-center", "text-on-surface-variant");
    state.doing.forEach(function (inst) {
      var c = cat(state, inst.catalogId);
      if (!c) return;
      var sis = sister(state, c.sisterId);
      var border = sis && sis.borderColor ? sis.borderColor : "#ccc";
      var badge = sis && sis.badgeClass ? sis.badgeClass : "bg-secondary-container text-on-secondary-container";
      var label = sis ? sis.name + " (" + sis.age + ")" : "?";
      var wrap = document.createElement("div");
      wrap.className = "bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/60 p-4 sm:p-card-padding";
      wrap.style.borderLeft = "5px solid " + border;
      wrap.innerHTML =
        "<div class=\"flex justify-between items-start gap-3 mb-3\">" +
        "<span class=\"" + esc(badge) + " text-label-sm font-label-bold px-3 py-1 rounded-full normal-case\">" + esc(label) + "</span>" +
        "<span class=\"material-symbols-outlined text-primary text-[28px] shrink-0\">rocket_launch</span>" +
        "</div>" +
        "<h3 class=\"font-title-md text-title-md text-on-surface mb-3 leading-snug\">" + esc(c.title) + "</h3>" +
        timerHtml(inst) +
        "<div class=\"flex justify-between items-center mb-4 flex-wrap gap-2\">" +
        "<div class=\"bg-tertiary-container text-on-tertiary-container font-label-bold px-4 py-1.5 rounded-full flex items-center gap-1\">" +
        "<span class=\"material-symbols-outlined text-[18px]\">payments</span> " +
        esc(rewardValueLabel(c)) +
        "</div></div>" +
        "<button type=\"button\" class=\"kid-done-btn w-full min-h-12 bg-primary text-on-primary font-label-bold px-4 py-3 rounded-xl shadow-[0_2px_0_0_#0e5131] active:translate-y-[2px] active:shadow-none transition-all flex items-center justify-center gap-2\">" +
        "<span class=\"material-symbols-outlined text-[20px]\">done</span>" +
        "<span>Terminei — pedir ok</span>" +
        "</button>";
      wrap.querySelector(".kid-done-btn").addEventListener("click", function (e) {
        e.stopPropagation();
        CM.submitForApproval(inst.id);
      });
      el.appendChild(wrap);
    });
  }

  function renderPending(state) {
    var el = document.getElementById("kid-col-pending");
    document.getElementById("kid-count-pending").textContent = String(state.pending.length);
    el.innerHTML = "";
    if (state.pending.length === 0) {
      el.innerHTML =
        "<div class=\"rounded-2xl border border-dashed border-outline-variant bg-surface-container-low p-5 text-center text-on-surface-variant\">" +
        "<span class=\"material-symbols-outlined text-4xl mb-2 text-tertiary\">fact_check</span>" +
        "<p class=\"font-title-md text-title-md text-on-surface\">Sem pendências</p>" +
        "<p class=\"font-body-md text-sm mt-1\">Quando uma tarefa for enviada, ela aparece aqui.</p>" +
        "</div>";
      return;
    }
    state.pending.forEach(function (inst) {
      var c = cat(state, inst.catalogId);
      if (!c) return;
      var sis = sister(state, c.sisterId);
      var border = sis && sis.borderColor ? sis.borderColor : "#ccc";
      var badge = sis && sis.badgeClass ? sis.badgeClass : "bg-primary-container text-on-primary-container";
      var label = sis ? sis.name + " (" + sis.age + ")" : "?";
      var div = document.createElement("div");
      div.className = "bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/60 p-4 sm:p-card-padding relative overflow-hidden opacity-95";
      div.style.borderLeft = "5px solid " + border;
      div.innerHTML =
        "<div class=\"flex justify-between items-start gap-3 mb-3\">" +
        "<span class=\"" + esc(badge) + " text-label-sm font-label-bold px-3 py-1 rounded-full normal-case\">" + esc(label) + "</span>" +
        "<span class=\"material-symbols-outlined text-primary text-[28px] shrink-0\">hourglass_empty</span>" +
        "</div>" +
        "<h3 class=\"font-title-md text-title-md text-on-surface mb-4 leading-snug\">" + esc(c.title) + "</h3>" +
        "<div class=\"bg-tertiary-container text-on-tertiary-container font-label-bold px-4 py-1.5 rounded-full inline-flex items-center gap-1\">" +
        "<span class=\"material-symbols-outlined text-[18px]\">payments</span> " +
        esc(rewardValueLabel(c)) +
        "</div>" +
        "<p class=\"mt-3 text-label-sm text-on-surface-variant\">Aguardando confirmação no painel dos pais.</p>";
      el.appendChild(div);
    });
  }

  function renderCompleted(state) {
    var el = document.getElementById("kid-col-completed");
    var completedNow = state.available.filter(function (inst) {
      var c = cat(state, inst.catalogId);
      if (!c) return false;
      return CM.isTaskCompletedInPeriod && CM.isTaskCompletedInPeriod(c.id);
    }).sort(function(a, b) {
      return (state.completedAtByCatalog[b.catalogId] || 0) - (state.completedAtByCatalog[a.catalogId] || 0);
    });
    document.getElementById("kid-count-completed").textContent = String(completedNow.length);
    el.innerHTML = "";
    if (completedNow.length === 0) {
      el.innerHTML =
        "<div class=\"rounded-2xl border border-dashed border-outline-variant bg-surface-container-low p-5 text-center text-on-surface-variant\">" +
        "<span class=\"material-symbols-outlined text-4xl mb-2 text-secondary\">task_alt</span>" +
        "<p class=\"font-title-md text-title-md text-on-surface\">Nenhuma concluída</p>" +
        "<p class=\"font-body-md text-sm mt-1\">As tarefas aprovadas aparecem aqui.</p>" +
        "</div>";
      return;
    }
    var visibleCompleted = completedExpanded ? completedNow : completedNow.slice(0, 5);
    if (completedNow.length > 5) {
      var summary = document.createElement("div");
      summary.className = "rounded-2xl bg-surface-container-low border border-outline-variant/60 p-3 flex items-center justify-between gap-3";
      summary.innerHTML =
        "<div class=\"min-w-0\">" +
        "<p class=\"font-label-bold text-label-bold text-on-surface\">" + completedNow.length + " tarefas concluídas</p>" +
        "<p class=\"text-label-sm text-on-surface-variant normal-case\">" + (completedExpanded ? "Mostrando todas." : "Mostrando as 5 mais recentes.") + "</p>" +
        "</div>" +
        "<button type=\"button\" class=\"completed-toggle min-h-10 rounded-xl bg-secondary-container text-on-secondary-container px-3 py-2 font-label-bold text-label-bold shrink-0\">" + (completedExpanded ? "Ver menos" : "Ver todas") + "</button>";
      summary.querySelector(".completed-toggle").addEventListener("click", function() {
        completedExpanded = !completedExpanded;
        renderCompleted(state);
      });
      el.appendChild(summary);
    }
    visibleCompleted.forEach(function (inst) {
      var c = cat(state, inst.catalogId);
      if (!c) return;
      var sis = sister(state, c.sisterId);
      var border = sis && sis.borderColor ? sis.borderColor : "#ccc";
      var badge = sis && sis.badgeClass ? sis.badgeClass : "bg-secondary-container text-on-secondary-container";
      var label = sis ? sis.name + " (" + sis.age + ")" : "?";
      
      var doneTime = state.completedAtByCatalog[c.id];
      var doneText = "";
      if (doneTime) {
         var d = new Date(doneTime);
         var today = new Date();
         if (d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) {
            doneText = "Hoje às " + d.toLocaleTimeString("pt-BR", {hour: '2-digit', minute:'2-digit'});
         } else {
            doneText = d.toLocaleDateString("pt-BR", {day: '2-digit', month: '2-digit'}) + " às " + d.toLocaleTimeString("pt-BR", {hour: '2-digit', minute:'2-digit'});
         }
      }

      var div = document.createElement("div");
      div.className = "bg-surface-container rounded-2xl shadow-sm border border-outline-variant/50 p-4 sm:p-card-padding opacity-80";
      div.style.borderLeft = "5px solid " + border;
      div.innerHTML =
        "<div class=\"flex justify-between items-start gap-3 mb-2\">" +
        "<span class=\"" + esc(badge) + " text-label-sm font-label-bold px-3 py-1 rounded-full normal-case\">" + esc(label) + "</span>" +
        "<span class=\"material-symbols-outlined text-secondary text-[28px] shrink-0\">check_circle</span>" +
        "</div>" +
        "<h3 class=\"font-title-md text-title-md mb-2 line-through text-on-surface-variant leading-snug\">" + esc(c.title) + "</h3>" +
        "<div class=\"flex justify-between items-center mt-3 flex-wrap gap-2\">" +
        "<span class=\"text-label-sm font-label-bold text-secondary\">" + (c.rewardType === "extra" ? "Recompensa paga" : "Cumprimento registrado") + "</span>" +
        (doneText ? "<span class=\"text-label-sm text-on-surface-variant\">" + doneText + "</span>" : "") +
        "</div>";
      el.appendChild(div);
    });
  }

  function goalPercent(sis) {
    var g = Number(sis.goalAmountBRL) || 1;
    var b = Number(sis.balanceBRL) || 0;
    return Math.min(100, Math.round((b / g) * 100));
  }

  function renderSavings(state) {
    var el = document.getElementById("kid-col-savings");
    el.innerHTML = "";
    state.sisters.forEach(function (sis) {
      var pct = goalPercent(sis);
      var img = sis.avatarUrl || "";
      var bar = sis.borderColor || "#94d5ab";
      var card = document.createElement("div");
      card.className = "bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/60 p-4 sm:p-6 relative overflow-hidden";
      card.innerHTML =
        "<div class=\"flex items-center gap-4 mb-5\">" +
        "<div class=\"w-16 h-16 rounded-full flex items-center justify-center border-4 border-white shadow-sm overflow-hidden shrink-0\" style=\"background:" + esc(bar) + "\">" +
        (img ? "<img alt=\"" + esc(sis.name) + "\" class=\"w-full h-full object-cover rounded-full\" src=\"" + esc(img) + "\"/>" : "<span class=\"text-2xl\">⭐</span>") +
        "</div>" +
        "<div class=\"min-w-0\">" +
        "<p class=\"font-label-bold text-label-bold text-on-surface-variant normal-case truncate\">" + esc(sis.name) + " (" + esc(String(sis.age)) + " anos)</p>" +
        "<p class=\"font-display-lg text-[30px] leading-tight text-primary\">" + esc(CM.fmtBRL(sis.balanceBRL)) + "</p>" +
        "</div></div>" +
        "<div class=\"flex items-center justify-between gap-3 mb-2\">" +
        "<p class=\"text-label-sm font-label-bold text-on-surface-variant normal-case truncate\">Meta: " + esc(sis.goalLabel) + "</p>" +
        "<p class=\"text-label-sm font-label-bold text-primary shrink-0\">" + pct + "%</p>" +
        "</div>" +
        "<div class=\"h-4 bg-surface-container rounded-full overflow-hidden\">" +
        "<div class=\"h-full rounded-full transition-all\" style=\"width:" + pct + "%;background:" + esc(bar) + "\"></div>" +
        "</div>" +
        "<p class=\"text-label-sm text-on-surface-variant mt-2 text-right normal-case\">Objetivo: " + esc(CM.fmtBRL(sis.goalAmountBRL || 0)) + "</p>";
      el.appendChild(card);
    });
  }

  function renderAll() {
    console.log('[Tela1] renderAll chamado');
    var state = CM.getState();
    console.log('[Tela1] Estado atual:', state.sisters ? state.sisters.length + ' filhas' : 'sem filhas');
    renderProgressTracks(state);
    renderAvailable(state);
    renderDoing(state);
    renderPending(state);
    renderCompleted(state);
    renderSavings(state);
  }

  console.log('[Tela1] Script iniciado');
  CM.onChange(renderAll);
  console.log('[Tela1] Aguardando initSync()...');
  CM.initSync().then(function() {
    console.log('[Tela1] initSync() concluído, chamando renderAll');
    renderAll();
  }).catch(function(err) {
    console.error("[Tela1] Erro na sincronização:", err);
    console.log('[Tela1] Chamando renderAll mesmo com erro');
    renderAll();
  });

  // Atualiza tarefas agendadas e temporizadores.
  setInterval(function() {
    renderAll();
  }, 30000);
})();
</script>
</body></html>
